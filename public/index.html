<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSP Overview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" />
  <style>
    .chart-box { height: 260px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: .5rem; }
  </style>
</head>
<body>
<div class="page">
  <header class="navbar navbar-expand-md navbar-light d-print-none">
    <div class="container-xl">
      <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
        NSP Overview
      </h1>
      <div class="navbar-nav flex-row order-md-last">
        <span id="health" class="badge bg-secondary-lt align-self-center">checking…</span>
      </div>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <div class="row row-deck row-cards">
          <div class="col-sm-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="subheader">Total tickets</div>
                <div class="h1 mb-0" id="stat-total">—</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="subheader">Open</div>
                <div class="h1 mb-0 text-green" id="stat-open">—</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="subheader">Closed</div>
                <div class="h1 mb-0 text-muted" id="stat-closed">—</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-3">
            <div class="card">
              <div class="card-body">
                <div class="subheader">Last 30 days</div>
                <div class="h1 mb-0 text-blue" id="stat-recent">—</div>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card">
              <div class="card-header"><h3 class="card-title">Tickets created (last 30 days)</h3></div>
              <div class="card-body"><div id="chart-trend" class="chart-box"></div></div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card">
              <div class="card-header"><h3 class="card-title">By status</h3></div>
              <div class="card-body"><div id="chart-status" class="chart-box"></div></div>
            </div>
          </div>

          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Tickets per agent group</h3>
                <div class="text-muted small ms-auto">last 5,000 tickets</div>
              </div>
              <div class="card-body"><div id="chart-agentgroup"></div></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <footer class="footer footer-transparent d-print-none">
      <div class="container-xl">
        <div class="row text-muted">
          <div class="col-auto">Live NSP data via backend proxy. Token stays server-side.</div>
        </div>
      </div>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.2/dist/apexcharts.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
